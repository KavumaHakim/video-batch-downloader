[project]
name = "video-batch-downloader"
version = "0.1.0"
description = "A CustomTkinter frontend for batch video downloading with yt-dlp."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.6",
    "yt-dlp>=2024.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
